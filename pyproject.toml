[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-agent"
version = "0.1.0"
description = "AI-powered day trading agent for NSE/BSE markets"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    # Anthropic Claude API
    "anthropic>=0.40.0",
    # Market data
    "yfinance>=0.2.40",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    # Technical analysis
    "ta>=0.11.0",
    # News fetching
    "feedparser>=6.0.11",
    "newsapi-python>=0.2.7",
    "httpx>=0.27.0",
    # Configuration & env
    "pydantic>=2.5.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    # Scheduling
    "schedule>=1.2.0",
    # Logging
    "structlog>=24.1.0",
    # Optional: Zerodha broker
    "kiteconnect>=5.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pandas-stubs>=2.1.0",
]

[project.scripts]
trade-agent = "trade_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m not integration')",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
